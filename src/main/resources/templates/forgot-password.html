<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>ExpenseFlow · Forgot Password</title>
    <link href="/css/auth.css" rel="stylesheet"/>
  </head>
  <body>
    <main class="auth-shell">
      <div class="brand"><span class="brand-mark">₹</span>
        <div><strong>ExpenseFlow</strong><small>Account recovery</small></div>
      </div>
      <section class="auth-card">
        <p class="eyebrow">PASSWORD RECOVERY</p>
        <h1>Forgot your password?</h1>
        <p class="hint">Enter the email associated with your account. If an account exists, we'll email a secure reset link.</p>
        <div class="message success" role="status" th:if="${message}" th:text="${message}"></div>
        <div class="message error" role="alert" th:if="${error}" th:text="${error}"></div>
        <form action="/forgot-password" method="post"><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/>
          <div class="field"><label>Email</label><input name="email" required="" type="email"/></div>
          <button class="btn">Email reset link</button>
        </form>
        <div class="links"><a href="/login">← Back to login</a></div>
      </section>
    </main>
  </body>
</html>
