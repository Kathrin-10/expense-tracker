<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExpenseFlow · Expenses</title><link rel="stylesheet" href="/css/style.css"></head><body data-page="expenses"><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">₹</span><div><strong>ExpenseFlow</strong><small>Personal finance</small></div></div><nav><a href="/dashboard">Overview</a><a class="active" href="/expenses">Expenses</a><a href="/categories">Categories</a><a href="/reports">Monthly Reports</a></nav><div class="sidebar-foot"><span class="status-dot"></span> Local workspace</div></aside><main class="main"><header class="topbar"><div><p class="eyebrow">TRANSACTIONS</p><h1>Expenses</h1><p class="muted">Search, filter and manage every transaction.</p></div><button class="btn primary" id="addBtn">+ Add expense</button></header>
<section class="panel filters"><div class="filter"><label>Search title</label><input id="search" placeholder="e.g. supermarket"></div><div class="filter"><label>Category</label><select id="category"><option value="">All categories</option></select></div><div class="filter"><label>Month</label><input type="month" id="month"></div><div class="filter"><label>From</label><input type="date" id="fromDate"></div><div class="filter"><label>To</label><input type="date" id="toDate"></div><button class="btn ghost" id="clearFilters">Clear</button><button class="btn secondary" id="exportBtn">Export CSV</button></section>
<section class="panel table-panel"><div class="panel-head"><div><h2>Expense history</h2><p class="muted" id="resultSummary">Loading…</p></div><div class="table-tools"><select id="sort"><option value="expenseDate:DESC">Newest</option><option value="expenseDate:ASC">Oldest</option><option value="amount:DESC">Highest amount</option><option value="amount:ASC">Lowest amount</option><option value="title:ASC">Title A–Z</option></select></div></div><div class="table-wrap"><table><thead><tr><th>Expense</th><th>Category</th><th>Date</th><th>Amount</th><th></th></tr></thead><tbody id="expenseRows"></tbody></table><div class="empty hidden" id="empty">No expenses match your filters.</div></div><div class="pagination"><span id="pageInfo"></span><div><button class="btn small ghost" id="prev">Previous</button><button class="btn small ghost" id="next">Next</button></div></div></section></main></div>
<div class="modal-backdrop hidden" id="modal"><div class="modal"><div class="modal-head"><div><p class="eyebrow" id="modalEyebrow">NEW TRANSACTION</p><h2 id="modalTitle">Add expense</h2></div><button class="icon-btn" id="closeModal">×</button></div><form id="expenseForm"><input type="hidden" id="expenseId"><div class="form-grid"><div class="field full"><label>Title *</label><input id="title" maxlength="120" required placeholder="e.g. Grocery shopping"></div><div class="field"><label>Amount *</label><input id="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></div><div class="field"><label>Date *</label><input id="expenseDate" type="date" required></div><div class="field full"><label>Category *</label><select id="expenseCategory" required></select></div><div class="field full"><label>Description</label><textarea id="description" maxlength="250" rows="3" placeholder="Optional note about this expense"></textarea><small class="counter"><span id="descCount">0</span>/250</small></div></div><div id="formError" class="form-error hidden"></div><div class="modal-actions"><button type="button" class="btn ghost" id="cancelModal">Cancel</button><button class="btn primary" id="saveBtn">Save expense</button></div></form></div></div><div id="toast"></div><script src="/js/app.js"></script><script src="/js/expenses.js"></script></body></html>
