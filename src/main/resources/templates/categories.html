<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ExpenseFlow · Categories</title><link rel="stylesheet" href="/css/style.css"></head><body data-page="categories"><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-mark">₹</span><div><strong>ExpenseFlow</strong><small>Personal finance</small></div></div><nav><a href="/dashboard">Overview</a><a href="/expenses">Expenses</a><a class="active" href="/categories">Categories</a><a href="/reports">Monthly Reports</a></nav><div class="sidebar-foot"><span class="status-dot"></span> Local workspace</div></aside><main class="main"><header class="topbar"><div><p class="eyebrow">ORGANIZATION</p><h1>Categories</h1><p class="muted">Keep your spending groups clean and meaningful.</p></div><button class="btn primary" id="addCategory">+ Add category</button></header><section class="panel"><div class="panel-head"><div><h2>Expense categories</h2><p class="muted">Categories with existing expenses cannot be deleted.</p></div></div><div class="category-grid" id="categoryGrid"></div></section></main></div><div class="modal-backdrop hidden" id="categoryModal"><div class="modal compact"><div class="modal-head"><div><p class="eyebrow">CATEGORY</p><h2 id="categoryModalTitle">Add category</h2></div><button class="icon-btn" id="closeCategory">×</button></div><form id="categoryForm"><input type="hidden" id="categoryId"><div class="field"><label>Category name *</label><input id="categoryName" maxlength="50" required placeholder="e.g. Education"></div><div id="categoryError" class="form-error hidden"></div><div class="modal-actions"><button type="button" class="btn ghost" id="cancelCategory">Cancel</button><button class="btn primary">Save category</button></div></form></div></div><div id="toast"></div><script src="/js/app.js"></script><script src="/js/categories.js"></script></body></html>
