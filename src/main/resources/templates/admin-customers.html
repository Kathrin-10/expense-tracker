<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <meta name="csrf-token" th:content="${_csrf.token}"/>
    <title>ExpenseFlow · Admin Customers</title>
    <link href="/css/style.css" rel="stylesheet"/>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">A</span>
          <div><strong>ExpenseFlow</strong><small>Administration</small></div>
        </div>
        <nav><a class="active" href="/admin/customers">Customers</a></nav>
        <div class="sidebar-foot">
          <form action="/logout" method="post"><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/><button class="btn ghost small" style="width:100%">Sign out</button></form>
        </div>
      </aside>
      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">ADMINISTRATION</p>
            <h1>Customer accounts</h1>
            <p class="muted">View account status and update customer details.</p>
          </div>
        </header>
        <section class="panel table-panel">
          <div class="panel-head">
            <div>
              <h2>Customers</h2>
              <p class="muted" id="customerSummary">Loading…</p>
            </div>
            <select id="statusFilter"><option value="all">All customers</option><option value="active">Active</option><option value="inactive">Inactive</option></select>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Customer</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="customerRows"></tbody>
            </table>
            <div class="empty hidden" id="customerEmpty">No customers found.</div>
          </div>
        </section>
      </main>
    </div>
    <div class="modal-backdrop hidden" id="customerModal">
      <div class="modal">
        <div class="modal-head">
          <div>
            <p class="eyebrow">CUSTOMER</p>
            <h2>Edit customer</h2>
          </div>
          <button class="icon-btn" id="closeCustomer">×</button>
        </div>
        <form id="customerForm"><input id="customerId" type="hidden"/>
          <div class="form-grid">
            <div class="field"><label>Full name</label><input id="customerName" maxlength="100" required=""/></div>
            <div class="field"><label>Email</label><input id="customerEmail" maxlength="150" required="" type="email"/></div>
            <div class="field full"><label>Phone</label><input id="customerPhone" maxlength="30"/></div>
            <div class="field full"><label><input id="customerActive" style="width:auto;margin-right:7px" type="checkbox"/>Account active</label></div>
          </div>
          <div class="form-error hidden" id="customerError"></div>
          <div class="modal-actions"><button class="btn ghost" id="cancelCustomer" type="button">Cancel</button><button class="btn primary">Save customer</button></div>
        </form>
      </div>
    </div>
    <div id="toast"></div>
    <script src="/js/app.js"></script>
    <script src="/js/admin-customers.js"></script>
  </body>
</html>
