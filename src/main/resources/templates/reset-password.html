<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>ExpenseFlow · Reset Password</title>
    <link href="/css/auth.css" rel="stylesheet"/>
  </head>
  <body>
    <main class="auth-shell">
      <div class="brand"><span class="brand-mark">₹</span>
        <div><strong>ExpenseFlow</strong><small>Account recovery</small></div>
      </div>
      <section class="auth-card">
        <p class="eyebrow">RESET PASSWORD</p>
        <h1>Choose a new password</h1>
        <p class="hint">The reset link is valid for 30 minutes and can only be used once.</p>
        <div class="error" role="alert" th:if="${error}" th:text="${error}"></div>
        <form action="/reset-password" method="post"><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"/><input name="token" th:value="${token}" type="hidden"/>
          <div class="field"><label>New password</label><input minlength="8" name="password" required="" type="password"/></div>
          <div class="field"><label>Confirm password</label><input minlength="8" name="confirmPassword" required="" type="password"/></div>
          <button class="btn">Reset password</button>
        </form>
        <div class="links"><a href="/login">← Back to login</a></div>
      </section>
    </main>
  </body>
</html>
